services:
  postgres:
    image: postgres:16
    container_name: loopnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopnow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: loopnow_cpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopnow -d loopnow_cpa"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loopnow-cpa-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APPROVAL_REVIEWER_ID: ${APPROVAL_REVIEWER_ID:?Set APPROVAL_REVIEWER_ID in .env}
      APPROVAL_REVIEWER_TOKEN: ${APPROVAL_REVIEWER_TOKEN:?Set APPROVAL_REVIEWER_TOKEN in .env}
    ports:
      - "3000:3000"
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npm run start -- --hostname 0.0.0.0 --port 3000

volumes:
  postgres_data:
